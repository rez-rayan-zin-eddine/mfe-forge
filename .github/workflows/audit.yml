name: Dependency Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Dev-tooling-only advisories with no fix available in our ranges:
      # - GHSA-vfj7-8cjw-p6xm braces (via @changesets/cli): no patched release exists yet
      # - GHSA-fx2h-pf6j-xcff vite 5 (via vitepress 1.x, docs dev server, Windows-only): needs vitepress 2
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-fx2h-pf6j-xcff
